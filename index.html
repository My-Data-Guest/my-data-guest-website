<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Data Guest — AI Without the Hype</title>
    <link rel="canonical" href="https://mydataguest.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#02738d" />

    <!-- Performance: fonts and the LCP hero image -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.rss2json.com" />
    <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Baseline SEO (kept in sync by src/hooks/useDocumentHead.ts once React mounts) -->
    <meta
      name="description"
      content="AI without the hype. My Data Guest is a podcast and newsletter by Alessandro Romano and Rosaria Silipo — real stories, honest conversations, and practical advice from people building with data and AI."
    />
    <meta name="author" content="Alessandro Romano, Rosaria Silipo" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Data Guest" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://mydataguest.com/" />
    <meta property="og:title" content="My Data Guest — AI Without the Hype" />
    <meta
      property="og:description"
      content="A podcast and newsletter about building with data and AI — real stories, honest conversations, and practical advice from practitioners."
    />
    <meta property="og:image" content="https://mydataguest.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="My Data Guest — AI Without the Hype" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Data Guest — AI Without the Hype" />
    <meta
      name="twitter:description"
      content="A podcast and newsletter about building with data and AI — real stories, honest conversations, and practical advice from practitioners."
    />
    <meta name="twitter:image" content="https://mydataguest.com/og-image.png" />
    <meta name="twitter:image:alt" content="My Data Guest — AI Without the Hype" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: sans-serif">
        <h1>My Data Guest — AI Without the Hype</h1>
        <p>
          A podcast and newsletter about building with data and AI, hosted by Alessandro Romano and
          Rosaria Silipo. This site needs JavaScript to load the latest episodes and articles — you
          can also find us on
          <a href="https://mydataguest.substack.com/">Substack</a>,
          <a href="https://podcasters.spotify.com/pod/show/pigna19908">Spotify</a>,
          <a href="https://podcasts.apple.com/us/podcast/my-data-guest/id1837487759">Apple Podcasts</a>
          and <a href="https://www.youtube.com/@MyDataGuest1">YouTube</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
